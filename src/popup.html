<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Take A Break</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <section class="hero">
        <div class="eyebrow">Take A Break</div>
        <h1 id="preset">Loading…</h1>
        <p id="mode" class="mode">Loading reminder state…</p>
        <p id="summary">Loading reminder state…</p>
        <p id="details" class="details"></p>
      </section>

      <section class="card quick-start">
        <div class="section-head">
          <p class="section-label">Quick start</p>
          <p class="section-note">Launch any break immediately.</p>
        </div>
        <div id="quick-actions" class="action-grid"></div>
      </section>

      <section class="card status-card">
        <div class="section-head compact-head">
          <p class="section-label">Reminder status</p>
          <p class="section-note"><span id="enabled-count">0</span> reminder types active</p>
        </div>
        <div id="status-grid" class="status-grid"></div>
      </section>

      <section class="card stats">
        <div class="stat-tile">
          <span class="label">Breaks completed</span>
          <strong id="completed">0</strong>
        </div>
        <div class="stat-tile">
          <span class="label">Reminders shown</span>
          <strong id="shown">0</strong>
        </div>
        <button id="open-options" class="primary stat-action" type="button">Open settings</button>
      </section>

      <section class="card info">
        <div class="section-head">
          <p class="section-label">What each break does</p>
          <p class="section-note">Each reminder type stays separate here for faster scanning.</p>
        </div>
        <div id="break-details" class="break-details"></div>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
